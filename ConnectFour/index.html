<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Four</title>
    <style>
      :root {
        --player1-color: red;
        --player2-color: green;
      }
      body {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: row;
        height: 100vh;
      }
      .container {
        width: 50%;
        display: flex;
        justify-content: center;
      }
      .leader-board {
        padding: 20px;
        border: 0.1px solid rgb(227, 201, 201);
        background: beige;
        border-radius: 10px;
      }
      .game-board {
        background: rgb(43, 141, 226);
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(7, 1fr);
        gap: 8px;
        padding: 10px;
        border-radius: 10px;
      }
      div.cell {
        width: 80px;
        height: 80px;
        background: white;
        border-radius: 50%;
      }

      .versus {
        margin-left: 10px;
        margin-right: 10px;
        color: blueviolet;
      }
      .player1 {
        color: var(--player1-color);
      }
      .player2 {
        color: var(--player2-color);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="leader-board">
        <h1>Connect Four</h1>
        <h3>
          <span class="player1">Player1</span><span class="versus">Vs</span
          ><span class="player2">Player2</span>
        </h3>
        <div
          class="cell"
          style="display: inline-block; background-color: red"
        ></div>
        <div
          class="cell"
          style="display: inline-block; background-color: green"
        ></div>

        <h3 class="winner-label"></h3>
      </div>
    </div>

    <div class="container">
      <div class="game-board"></div>
    </div>

    <script>
      const board = document.querySelector(".game-board ");
      const winnerLabel = document.querySelector(".winner-label");
      const player1color = "red";
      const player2color = "green";
      const ROWS = 7;
      const COLUMNS = 6;

      let data = new Array(ROWS)
        .fill(null)
        .map(() => new Array(COLUMNS).fill("white"));

      let turn = 0; // 0 player 1 Vs 1 player2
      let isGameOver = false;
      let winningRow = [];

      fillBoard();

      function fillBoard() {
        while (board.lastElementChild != null) {
          board.lastElementChild.remove();
        }

        for (let i = 0; i < ROWS; i++) {
          for (let j = 0; j < COLUMNS; j++) {
            const div = document.createElement("div");
            div.classList.add("cell");
            div.style.backgroundColor = data[i][j];
            board.appendChild(div);

            div.onclick = (event) => {
              if (isGameOver) {
                return;
              }
              for (let x = ROWS - 1; x >= 0; x--) {
                if (data[x][j] === "white") {
                  data[x][j] = currentPlayerColor();
                  break;
                }
              }
              togglePlayer();
              fillBoard();
            };
          }
        }

        if (isGameOver) {
          console.log("wining rows", winningRow);

          const winner = turn === 0 ? "Player1" : "Player2";
          alert(`Game over winner ${winner}`);
          winnerLabel.textContent = `Winner is ${winner}`;
          winnerLabel.style.color = turn === 0 ? "red" : "green";
          return;
        }
      }

      function checkGameOver() {
        for (let i = ROWS - 1; i >= 0; i--) {
          for (let j = 0; j < COLUMNS; j++) {
            if (data[i][j] !== "white") {
              // we have 3 directions right, right-up , up
              // then we need to check four spots;
              // check right direction
              for (let incr = 0; incr < 4; incr++) {
                winningRow.push({ r: i, c: j + incr });

                if (data[i][j + incr] !== data[i][j]) {
                  winningRow = [];
                  break;
                }
                if (incr === 3) {
                  isGameOver = true;
                  return;
                }
              }
              // check right up direction
              for (let incr = 0; incr < 4; incr++) {
                winningRow.push({ r: i - incr, c: j + incr });
                if (data[i - incr][j + incr] !== data[i][j]) {
                  winningRow = [];
                  break;
                }
                if (incr === 3) {
                  isGameOver = true;
                  return;
                }
              }
              // check up direction
              for (let incr = 0; incr < 4; incr++) {
                winningRow.push({ r: i - incr, c: j });

                if (data[i - incr][j] !== data[i][j]) {
                  winningRow = [];
                  break;
                }
                if (incr === 3) {
                  isGameOver = true;
                  return;
                }
              }
            }
          }
        }

        return false;
      }

      function togglePlayer() {
        checkGameOver();

        if (!isGameOver) {
          turn = turn === 0 ? 1 : 0;
        }
      }

      function currentPlayerColor() {
        return turn === 0 ? player1color : player2color;
      }
    </script>
  </body>
</html>
