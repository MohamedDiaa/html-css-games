<!-- Show image being the board so the user guess with the least number of boxes -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Four</title>
    <style>
      :root {
        --player1-color: red;
        --player2-color: green;
      }
      body {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: row;
        height: 100vh;
      }
      .leader-board {
        border: 1px solid black;
      }
      .game-board {
        background: rgb(43, 141, 226);
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(7, 1fr);
        gap: 8px;
        padding: 10px;
        border-radius: 10px;
      }
      div.cell {
        width: 80px;
        height: 80px;
        background: white;
        border-radius: 50%;
      }

      .versus {
        margin-left: 10px;
        margin-right: 10px;
        color: blueviolet;
      }
      .player1 {
        color: var(--player1-color);
      }
      .player2 {
        color: var(--player2-color);
      }
    </style>
  </head>
  <body>
    <div class="leader-board">
      <h1>Connect Four</h1>
      <h3>
        <span class="player1">Player1</span><span class="versus">Vs</span
        ><span class="player2">Player2</span>
      </h3>
    </div>

    <div class="game-board"></div>

    <script>
      const board = document.querySelector(".game-board ");
      const player1color = "red";
      const player2color = "green";
      const ROWS = 6;
      const COLUMNS = 7;

      let data = new Array(ROWS)
        .fill(null)
        .map(() => new Array(COLUMNS).fill("white"));

      fillBoard();

      function fillBoard() {
        while (board.lastElementChild != null) {
          board.lastElementChild.remove();
        }

        for (let i = 0; i < ROWS; i++) {
          for (let j = 0; j < COLUMNS; j++) {
            const div = document.createElement("div");
            div.classList.add("cell");
            div.style.backgroundColor = data[i][j];

            board.appendChild(div);
            div.onclick = (event) => {
              data[i][j] = "red";
              fillBoard();
            };
          }
        }
      }
    </script>
  </body>
</html>
